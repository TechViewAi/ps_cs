<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Powerful Intention</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">

    <link rel="stylesheet" href="styles.css">
    <style>
        .thank-you-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        .thank-you-title {
            font-family: var(--font-display);
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            color: var(--charcoal);
            margin-bottom: 1rem;
        }
        .thank-you-message {
            font-size: 1rem;
            color: var(--charcoal);
            opacity: 0.8;
            max-width: 400px;
            line-height: 1.7;
            margin-bottom: 2rem;
        }
        .back-link {
            display: inline-block;
            padding: 0.875rem 2rem;
            font-family: var(--font-body);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--warm-white);
            background: var(--mauve);
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .back-link:hover {
            background: var(--charcoal);
            transform: scale(1.02);
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="bg-gradient"></div>

        <main class="main-content">
            <div class="logo-icon">
                <img src="assets/images/logo-ring.png" alt="Powerful Intention">
            </div>

            <div class="thank-you-icon">✨</div>

            <h1 class="thank-you-title">Thank You</h1>

            <p class="thank-you-message">
                You're on the list! We'll notify you as soon as we launch. Something sacred is on its way.
            </p>

            <a href="index.html" class="back-link">Back to Home</a>
        </main>

        <footer class="footer">
            <p>&copy; 2026 Powerful Intention</p>
        </footer>
    </div>
</body>
</html>
